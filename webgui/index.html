<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOENIX // OS HUD</title>
<style>
  :root {
    --gold:      #ffc94d;
    --gold-dim:  #8a6a1f;
    --gold-glow: rgba(255, 201, 77, .55);
    --amber:     #ff9d00;
    --green:     #39ff88;
    --red:       #ff5555;
    --bg:        #0d0a02;
    --panel:     rgba(30, 24, 8, .72);
    --panel-brd: rgba(255, 201, 77, .25);
    --text:      #f5eede;
    --text-dim:  #96895f;
    --user-bubble: rgba(255, 201, 77, .08);
    --ai-bubble:   rgba(255, 201, 77, .04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Consolas", "Segoe UI", monospace;
    overflow: hidden;
  }

  /* ---------- hex grid backdrop ---------- */
  .hexgrid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 25% 25%, rgba(255,201,77,.05) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,201,77,.04) 0%, transparent 40%);
  }
  .hexgrid::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,201,77,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,201,77,.035) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }

  /* ---------- layout ---------- */
  #app {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 260px;
    grid-template-rows: 64px 1fr auto;
    grid-template-areas:
      "top  top  top"
      "left chat right"
      "left input right";
    height: 100vh;
    gap: 10px; padding: 10px;
  }

  /* ---------- glass panel ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-brd);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 24px rgba(255,201,77,.06), inset 0 0 30px rgba(255,201,77,.03);
  }
  .panel-title {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold-dim); padding: 8px 12px 4px;
    border-bottom: 1px solid rgba(255,201,77,.12);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-title::before { content: "▍ "; color: var(--gold); }

  /* ---------- top bar ---------- */
  #topbar {
    grid-area: top; display: flex; align-items: center; gap: 16px;
    padding: 0 16px;
  }
  #topbar .logo {
    font-size: 18px; font-weight: bold; letter-spacing: 4px;
    color: var(--gold); text-shadow: 0 0 12px var(--gold-glow);
  }
  #topbar .logo span { color: var(--amber); }
  #topbar .tagline { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
  #topbar .spacer { flex: 1; }
  #clock { font-size: 12px; color: var(--gold); letter-spacing: 1px; }
  #conn-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  #conn-label { font-size: 10px; color: var(--text-dim); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  /* ---------- left sidebar ---------- */
  #left { grid-area: left; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }

  /* responsive: stack panels on narrow windows */
  @media (max-width: 900px) {
    #app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: 64px auto 1fr auto auto;
      grid-template-areas:
        "top"
        "left"
        "chat"
        "input"
        "right";
      overflow-y: auto;
    }
    #left, #right { overflow: visible; }
    #chat-panel { min-height: 320px; }
    #right { max-height: none; }
    #log-panel { min-height: 160px; }
  }

  /* arc reactor */
  #reactor-panel { padding-bottom: 12px; }
  .reactor {
    position: relative; width: 150px; height: 150px; margin: 14px auto 6px;
  }
  .reactor .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(255,201,77,.35);
    box-shadow: 0 0 18px rgba(255,201,77,.25), inset 0 0 18px rgba(255,201,77,.15);
  }
  .reactor .ring.r2 { inset: 14px; border-style: dashed; animation: spin 9s linear infinite; }
  .reactor .ring.r3 { inset: 28px; border-color: rgba(255,201,77,.55); animation: spin 6s linear infinite reverse; }
  .reactor .core {
    position: absolute; inset: 46px; border-radius: 50%;
    background: radial-gradient(circle, #fff8e0 0%, var(--gold) 35%, rgba(255,201,77,.15) 75%);
    box-shadow: 0 0 34px var(--gold-glow), 0 0 70px rgba(255,201,77,.35);
    animation: corepulse 2.4s ease-in-out infinite;
  }
  .reactor.idle .core { animation-duration: 4.5s; opacity: .75; }
  .reactor.thinking .ring.r2 { animation-duration: 2s; }
  .reactor.thinking .ring.r3 { animation-duration: 1.2s; }
  .reactor.thinking .core { animation-duration: .9s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes corepulse {
    0%,100% { box-shadow: 0 0 30px var(--gold-glow), 0 0 60px rgba(255,201,77,.3); }
    50%     { box-shadow: 0 0 44px var(--gold-glow), 0 0 90px rgba(255,201,77,.5); }
  }
  #reactor-state {
    text-align: center; font-size: 10px; letter-spacing: 3px;
    color: var(--gold); text-transform: uppercase;
  }

  /* provider info */
  #brain-panel .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 12px; font-size: 11px;
  }
  #brain-panel .row .k { color: var(--text-dim); }
  #brain-panel .row .v { color: var(--gold); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #brain-panel select {
    width: calc(100% - 24px); margin: 4px 12px 10px;
    background: rgba(255,201,77,.06); color: var(--gold);
    border: 1px solid var(--panel-brd); border-radius: 6px;
    font-family: inherit; font-size: 11px; padding: 5px 8px; outline: none;
    cursor: pointer;
  }
  #brain-panel select option { background: #2a2210; color: var(--gold); }

  /* quick actions */
  #actions-panel { flex: 1; overflow-y: auto; }
  #actions-panel .btn {
    display: block; width: calc(100% - 20px); margin: 6px 10px;
    padding: 8px 10px; text-align: left;
    background: rgba(255,201,77,.05); color: var(--text);
    border: 1px solid rgba(255,201,77,.18); border-radius: 7px;
    font-family: inherit; font-size: 11px; letter-spacing: .5px;
    cursor: pointer; transition: all .15s;
  }
  #actions-panel .btn:hover {
    background: rgba(255,201,77,.14); border-color: var(--gold);
    box-shadow: 0 0 12px rgba(255,201,77,.25); color: var(--gold);
  }

  /* ---------- right sidebar ---------- */
  #right { grid-area: right; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  #sys-panel .stat {
    padding: 8px 12px; font-size: 11px;
    display: flex; justify-content: space-between;
  }
  #sys-panel .stat .k { color: var(--text-dim); }
  #sys-panel .stat .v { color: var(--text); }
  #sys-panel .bar {
    height: 4px; margin: 0 12px 8px; background: rgba(255,201,77,.08);
    border-radius: 2px; overflow: hidden;
  }
  #sys-panel .bar > div {
    height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    box-shadow: 0 0 8px var(--gold-glow); border-radius: 2px;
    transition: width .5s ease;
  }
  #log-panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  #eventlog {
    flex: 1; overflow-y: auto; padding: 8px 12px;
    font-size: 10px; line-height: 1.7; color: var(--text-dim);
  }
  #eventlog .t { color: var(--gold-dim); }
  #eventlog .ok { color: var(--green); }
  #eventlog .warn { color: var(--amber); }

  /* ---------- chat ---------- */
  #chat-panel { grid-area: chat; display: flex; flex-direction: column; overflow: hidden; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #chat::-webkit-scrollbar, #eventlog::-webkit-scrollbar, #actions-panel::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb, #eventlog::-webkit-scrollbar-thumb, #actions-panel::-webkit-scrollbar-thumb {
    background: rgba(255,201,77,.25); border-radius: 3px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble); border: 1px solid rgba(255,201,77,.3);
    border-right: 2px solid var(--gold);
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--ai-bubble); border: 1px solid rgba(255,201,77,.14);
    border-left: 2px solid var(--gold-dim);
  }
  .msg.sys { align-self: center; font-size: 11px; color: var(--text-dim); background: none; border: none; padding: 2px; }
  .msg .who { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; color: var(--gold-dim); }
  .msg.user .who { color: var(--gold); }
  .msg.err { border-color: rgba(255,85,85,.4); }
  .msg.err .who { color: var(--red); }

  /* typing indicator */
  #typing { align-self: flex-start; display: none; padding: 4px 2px; }
  #typing span {
    display: inline-block; width: 6px; height: 6px; margin-right: 4px;
    border-radius: 50%; background: var(--gold);
    animation: blink 1.2s infinite;
  }
  #typing span:nth-child(2) { animation-delay: .2s; }
  #typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }

  /* ---------- input ---------- */
  #input-wrap { grid-area: input; display: flex; gap: 10px; padding: 10px; }
  #input-box {
    flex: 1; display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 14px;
  }
  #prompt {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: 14px; padding: 10px 0;
  }
  #prompt::placeholder { color: var(--text-dim); }
  .icmd {
    background: none; border: 1px solid rgba(255,201,77,.25); color: var(--gold-dim);
    font-family: inherit; font-size: 10px; padding: 4px 8px; border-radius: 5px;
    cursor: pointer; transition: all .15s;
  }
  .icmd:hover { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px rgba(255,201,77,.3); }
  #mic-btn, #send-btn {
    width: 46px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--panel-brd); background: rgba(255,201,77,.06);
    color: var(--gold); font-size: 17px; transition: all .15s;
  }
  #send-btn {
    background: rgba(255,201,77,.16); border-color: var(--gold);
    box-shadow: 0 0 14px rgba(255,201,77,.25);
  }
  #send-btn:hover { background: rgba(255,201,77,.3); box-shadow: 0 0 22px var(--gold-glow); }
  #mic-btn:hover { border-color: var(--gold); }
  #mic-btn.listening { color: var(--red); border-color: var(--red); animation: pulse 1s infinite; }

  /* corner brackets decoration */
  .corners { position: relative; }
  .corners::before, .corners::after {
    content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
  }
  .corners::before {
    top: -1px; left: -1px;
    border-top: 2px solid var(--gold); border-left: 2px solid var(--gold);
    border-top-left-radius: 10px;
  }
  .corners::after {
    bottom: -1px; right: -1px;
    border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold);
    border-bottom-right-radius: 10px;
  }

  /* scanline sweep */
  #scan {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, rgba(255,201,77,.03) 48%, rgba(255,201,77,.07) 50%, rgba(255,201,77,.03) 52%, transparent 100%);
    background-size: 100% 240px; animation: scanmove 7s linear infinite;
  }
  @keyframes scanmove { from { background-position: 0 -240px; } to { background-position: 0 100vh; } }

  /* boot overlay */
  #boot {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; transition: opacity .6s;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .reactor { width: 190px; height: 190px; }
  #boot .reactor .core { inset: 60px; }
  #boot .bootline { font-size: 11px; letter-spacing: 3px; color: var(--gold); }
  #boot .sub { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; }

  /* ================= modes ================= */
  /* DARKPHOENIX: the whole HUD bleeds dark violet */
  body.mode-darkphoenix {
    --gold: #b98aff; --gold-dim: #4d3570; --gold-glow: rgba(154,84,255,.55);
    --amber: #d46bff; --bg: #07040f;
    --panel: rgba(18, 10, 32, .78); --panel-brd: rgba(154,84,255,.30);
    --text: #e9defc; --text-dim: #7d6fa0;
    --user-bubble: rgba(154,84,255,.10); --ai-bubble: rgba(154,84,255,.05);
    --green: #8f7dff;
  }
  body.mode-darkphoenix .hexgrid {
    background-image:
      radial-gradient(circle at 25% 25%, rgba(154,84,255,.07) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(154,84,255,.06) 0%, transparent 40%);
  }
  body.mode-darkphoenix .hexgrid::before {
    background-image:
      linear-gradient(rgba(154,84,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(154,84,255,.05) 1px, transparent 1px);
  }
  body.mode-darkphoenix #scan {
    background: linear-gradient(180deg, transparent 0%, rgba(154,84,255,.04) 48%, rgba(154,84,255,.09) 50%, rgba(154,84,255,.04) 52%, transparent 100%);
    background-size: 100% 240px;
  }
  body.mode-god .mchip[data-mode="god"] { border-color: var(--gold); }

  /* mode chips in the top bar */
  #mode-chips { display: flex; gap: 6px; }
  .mchip {
    background: rgba(255,201,77,.05); color: var(--text-dim);
    border: 1px solid rgba(255,201,77,.25); border-radius: 6px;
    font-family: inherit; font-size: 10px; letter-spacing: 1px;
    padding: 5px 9px; outline: none; cursor: pointer; transition: all .15s;
  }
  .mchip:hover { color: var(--gold); border-color: var(--gold); }
  .mchip.active {
    color: var(--gold); border-color: var(--gold);
    background: rgba(255,201,77,.16);
    box-shadow: 0 0 12px var(--gold-glow); text-shadow: 0 0 8px var(--gold-glow);
  }
  body.mode-god .mchip[data-mode="god"] { box-shadow: 0 0 12px var(--gold-glow); }

  /* ghost-protocol wipe overlay */
  #ghostflash {
    position: fixed; inset: 0; z-index: 30; background: #07040f;
    display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px;
  }
  #ghostflash .gl {
    font-size: 13px; letter-spacing: 6px; color: var(--gold);
    text-transform: uppercase; text-shadow: 0 0 18px var(--gold-glow);
  }

  /* FULL VOICE: reactor-only HUD */
  body.mode-voice #topbar, body.mode-voice #right,
  body.mode-voice #chat-panel { display: none; }
  body.mode-voice #app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 1fr auto;
    grid-template-areas: "left" "input";
  }
  body.mode-voice #left { align-items: center; justify-content: center; }
  body.mode-voice #reactor-panel {
    background: none; border: none; box-shadow: none; backdrop-filter: none;
  }
  body.mode-voice .reactor { width: 300px; height: 300px; }
  body.mode-voice .reactor .core { inset: 96px; }
  body.mode-voice #reactor-state { font-size: 13px; letter-spacing: 6px; margin-top: 12px; }
  body.mode-voice #input-box .icmd, body.mode-voice #send-btn { display: none; }
  body.mode-voice #mic-btn {
    width: 60px; height: 60px; font-size: 24px;
    border-color: var(--gold); box-shadow: 0 0 24px var(--gold-glow);
  }
</style>
</head>
<body>
<div class="hexgrid"></div>
<div id="scan"></div>

<!-- boot splash -->
<div id="boot">
  <div class="reactor">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="core"></div>
  </div>
  <div class="bootline" id="bootline">INITIALIZING PHOENIX OS</div>
  <div class="sub">PHOENIX INTERFACE &nbsp;//&nbsp; v1.2</div>
</div>

<div id="app">
  <!-- TOP -->
  <div id="topbar" class="panel corners">
    <div class="logo">PHOENIX<span>//</span>OS</div>
    <div class="tagline">PERSONAL AI ASSISTANT</div>
    <div id="mode-chips" title="Phoenix modes (click to wake/sleep - they stack)">
      <button class="mchip" data-mode="darkphoenix" title="Ghost protocol: violet HUD, zero traces">● DP</button>
      <button class="mchip" data-mode="voice" title="Full voice: reactor-only, always-on mic">◉ VOX</button>
      <button class="mchip" data-mode="god" title="God: full tools, absolutely free-only">▲ GOD</button>
    </div>
    <div class="spacer"></div>
    <div id="clock">--:--:--</div>
    <div id="conn-dot"></div>
    <div id="conn-label">LINK</div>
  </div>

  <!-- LEFT -->
  <div id="left">
    <div id="reactor-panel" class="panel corners">
      <div class="panel-title">Core Status</div>
      <div class="reactor idle" id="reactor">
        <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="core"></div>
      </div>
      <div id="reactor-state">standby</div>
    </div>

    <div id="brain-panel" class="panel corners">
      <div class="panel-title">AI Brain</div>
      <div class="row"><span class="k">PROVIDER</span><span class="v" id="v-provider">—</span></div>
      <div class="row"><span class="k">MODEL</span><span class="v" id="v-model">—</span></div>
      <div class="row"><span class="k">KEY</span><span class="v" id="v-key">—</span></div>
      <select id="provider-select"><option>loading…</option></select>
    </div>

    <div id="actions-panel" class="panel corners">
      <div class="panel-title">Quick Actions</div>
      <button class="btn" data-cmd="/new">✦ &nbsp;New conversation</button>
      <button class="btn" data-cmd="/notes">◈ &nbsp;List notes</button>
      <button class="btn" data-cmd="/sys">▣ &nbsp;System report</button>
      <button class="btn" data-cmd="/time">◔ &nbsp;Local time</button>
      <button class="btn" data-cmd="/voice">🔊 &nbsp;Toggle voice out</button>
      <button class="btn" data-cmd="/mode darkphoenix">● &nbsp;DarkPhoenix (ghost)</button>
      <button class="btn" data-cmd="/mode voice">◉ &nbsp;Full voice mode</button>
      <button class="btn" data-cmd="/mode god">▲ &nbsp;God mode (free-only)</button>
      <button class="btn" data-cmd="/mode normal">◇ &nbsp;Normal mode</button>
      <button class="btn" data-cmd="/save">💾 &nbsp;Save transcript</button>
      <button class="btn" data-cmd="/help">☰ &nbsp;All commands</button>
    </div>
  </div>

  <!-- CENTER CHAT -->
  <div id="chat-panel" class="panel corners">
    <div class="panel-title"><span>Conversation Stream</span><span id="turn-count">0 MSGS</span></div>
    <div id="chat">
      <div class="msg sys">▸ Phoenix HUD online. Type a message, or use /commands.</div>
    </div>
    <div id="typing"><span></span><span></span><span></span></div>
  </div>

  <!-- INPUT -->
  <div id="input-wrap">
    <div id="input-box" class="panel corners">
      <input id="prompt" placeholder="Ask Phoenix anything…  (/ for commands)" autocomplete="off">
      <button class="icmd" data-cmd="/sys">/sys</button>
      <button class="icmd" data-cmd="/time">/time</button>
      <button class="icmd" data-cmd="/search ">/search</button>
    </div>
    <button id="mic-btn" title="Voice input (uses Phoenix's own mic)">🎙</button>
    <button id="send-btn" title="Send">➤</button>
  </div>

  <!-- RIGHT -->
  <div id="right">
    <div id="sys-panel" class="panel corners">
      <div class="panel-title">System Telemetry</div>
      <div class="stat"><span class="k">HOST</span><span class="v" id="v-host">—</span></div>
      <div class="stat"><span class="k">OS</span><span class="v" id="v-os">—</span></div>
      <div class="stat"><span class="k">CPU</span><span class="v" id="v-cpu">—</span></div>
      <div class="bar"><div id="bar-ram" style="width:0%"></div></div>
      <div class="stat"><span class="k">RAM FREE</span><span class="v" id="v-ram">—</span></div>
    </div>

    <div id="log-panel" class="panel corners">
      <div class="panel-title">Event Log</div>
      <div id="eventlog"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const chatEl = $("chat"), promptEl = $("prompt");
let busy = false, msgCount = 0;

/* ---------- clock ---------- */
setInterval(() => {
  $("clock").textContent = new Date().toLocaleTimeString("en-GB");
}, 1000);

/* ---------- log ---------- */
function log(text, cls) {
  const el = document.createElement("div");
  const t = new Date().toLocaleTimeString("en-GB");
  el.innerHTML = '<span class="t">[' + t + ']</span> <span class="' + (cls||"") + '">' + text + "</span>";
  $("eventlog").appendChild(el);
  $("eventlog").scrollTop = 1e9;
}

/* ---------- chat ---------- */
function addMsg(text, kind) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  const who = kind === "user" ? "YOU" : (kind === "err" ? "FAULT" : "PHOENIX");
  const w = document.createElement("div"); w.className = "who"; w.textContent = who;
  const b = document.createElement("div"); b.textContent = text;
  el.appendChild(w); el.appendChild(b);
  chatEl.appendChild(el);
  chatEl.scrollTop = 1e9;
  if (kind !== "sys") { msgCount++; $("turn-count").textContent = msgCount + " MSGS"; }
}

function setBusy(on) {
  busy = on;
  $("typing").style.display = on ? "block" : "none";
  $("reactor").classList.toggle("thinking", on);
  $("reactor").classList.toggle("idle", !on);
  $("reactor-state").textContent = on ? "processing" : "standby";
  $("send-btn").disabled = on;
  $("send-btn").style.opacity = on ? .4 : 1;
}

async function send(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  addMsg(text, "user");
  promptEl.value = "";
  setBusy(true);
  log("TX \u25b8 " + text.slice(0, 48));

  /* live message element for streaming */
  const live = document.createElement("div");
  live.className = "msg ai";
  const who = document.createElement("div"); who.className = "who";
  who.textContent = "PHOENIX";
  const body = document.createElement("div"); body.textContent = "";
  live.appendChild(who); live.appendChild(body);
  live.style.display = "none";      /* shown at first token */
  chatEl.appendChild(live);
  let liveShown = false, gotTokens = false;
  const showLive = () => { if (!liveShown) { live.style.display = "flex";
                                           liveShown = true; } };
  const scroll = () => { chatEl.scrollTop = 1e9; };

  try {
    const r = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    });
    if (!r.ok || !r.body) throw new Error("no stream");
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", finalReply = null, isErr = false;
    const toolsSeen = new Set();

    const flushFrame = (frame) => {
      if (frame.type === "token") {
        gotTokens = true; showLive();
        body.textContent += frame.text;
        scroll();
      } else if (frame.type === "tool_call") {
        showLive();
        const chip = document.createElement("div");
        chip.className = "who"; chip.style.color = "var(--amber)";
        chip.textContent = "\u25c7 tool: " + frame.name;
        live.insertBefore(chip, body);
        toolsSeen.add(frame.name); scroll();
        log("TOOL \u25b8 " + frame.name);
      } else if (frame.type === "tool_result") {
        log("TOOL \u2713 " + frame.name, "ok");
      } else if (frame.type === "error") {
        isErr = true;
      } else if (frame.type === "done") {
        finalReply = frame.reply;
      }
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const m = raw.match(/^data: (.*)$/s);
        if (m) { try { flushFrame(JSON.parse(m[1])); } catch (e) {} }
      }
    }

    if (finalReply !== null) {
      if (gotTokens || toolsSeen.size) {
        body.textContent = finalReply;
        if (isErr) { live.className = "msg err"; who.textContent = "FAULT"; }
      } else {
        live.remove();
        addMsg(finalReply, isErr ? "err" : "ai");
      }
    } else if (!liveShown) {
      live.remove();
      addMsg("(no reply - core dropped the stream)", "err");
    }
    log(isErr ? "RX \u25b8 error" : "RX \u25b8 reply", isErr ? "warn" : "ok");
  } catch (e) {
    live.remove();
    /* fallback: plain POST (older core or stream refused) */
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });
      const data = await r.json();
      addMsg(data.reply || "(empty reply)", data.error ? "err" : "ai");
      log(data.error ? "RX \u25b8 error" : "RX \u25b8 reply",
          data.error ? "warn" : "ok");
    } catch (e2) {
      addMsg("! Connection to Phoenix core lost: " + e2, "err");
      log("LINK DOWN", "warn");
    }
  }
  setBusy(false);
  promptEl.focus();
}

$("send-btn").onclick = () => send(promptEl.value);
promptEl.addEventListener("keydown", e => { if (e.key === "Enter") send(promptEl.value); });

/* quick actions + inline cmd chips */
document.querySelectorAll("[data-cmd]").forEach(btn => {
  btn.addEventListener("click", () => {
    const c = btn.getAttribute("data-cmd");
    if (c.endsWith(" ")) { promptEl.value = c; promptEl.focus(); }
    else send(c);
  });
});

/* ---------- status polling ---------- */
async function refreshStatus() {
  try {
    const r = await fetch("/api/status");
    const s = await r.json();
    $("v-provider").textContent = s.provider || "—";
    $("v-model").textContent = s.model || "—";
    $("v-key").textContent = s.has_key ? "LOADED" : "MISSING";
    $("v-key").style.color = s.has_key ? "var(--green)" : "var(--amber)";
    $("conn-dot").style.background = s.has_key ? "var(--green)" : "var(--amber)";
    $("conn-dot").style.boxShadow = "0 0 8px " + (s.has_key ? "var(--green)" : "var(--amber)");
    $("conn-label").textContent = s.has_key ? "LINK" : "NO KEY";
    $("v-host").textContent = s.host || "—";
    $("v-os").textContent = s.os || "—";
    $("v-cpu").textContent = s.cpu_cores ? (s.cpu_cores + " cores") : "—";
    $("v-ram").textContent = s.ram || "—";
    if (s.ram_free_gb && s.ram_total_gb) {
      const used = 100 - Math.round(100 * s.ram_free_gb / s.ram_total_gb);
      $("bar-ram").style.width = Math.max(4, Math.min(100, used)) + "%";
    }
    if (Array.isArray(s.modes) &&
        (s.modes.join() !== currentModes.join())) applyModes(s.modes);
    // provider dropdown
    const sel = $("provider-select");
    if (sel.dataset.loaded !== "1" && s.providers) {
      sel.innerHTML = "";
      s.providers.forEach(p => {
        const o = document.createElement("option");
        o.value = p; o.textContent = p;
        if (p === s.provider) o.selected = true;
        sel.appendChild(o);
      });
      sel.dataset.loaded = "1";
    }
  } catch (e) { /* core down; keep last state */ }
}
$("provider-select").addEventListener("change", async e => {
  const p = e.target.value;
  try {
    await fetch("/api/provider", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: p }) });
    log("BRAIN ▸ switched to " + p, "ok");
  } catch (err) { log("SWITCH FAILED", "warn"); }
  refreshStatus();
});
refreshStatus();
setInterval(refreshStatus, 5000);

/* ---------- modes (independent chips; they stack) ---------- */
let currentModes = [];

function applyModes(modes) {
  currentModes = modes || [];
  document.body.classList.remove("mode-darkphoenix", "mode-voice", "mode-god");
  if (currentModes.includes("darkphoenix")) document.body.classList.add("mode-darkphoenix");
  if (currentModes.includes("voice")) document.body.classList.add("mode-voice");
  if (currentModes.includes("god")) document.body.classList.add("mode-god");
  document.querySelectorAll(".mchip").forEach(c => {
    c.classList.toggle("active", currentModes.includes(c.dataset.mode));
  });
  voiceWake = currentModes.includes("voice");
}

async function setMode(mode) {
  try {
    const r = await fetch("/api/mode", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: mode }) });
    const d = await r.json();
    applyModes(d.modes || []);
    if (d.reply) addMsg(d.reply, "sys");
    if (d.purge) {                       /* darkphoenix: wipe animation */
      const gf = $("ghostflash");
      gf.style.display = "flex";
      gf.innerHTML = '<div class="gl">GHOST PROTOCOL</div>' +
                     '<div class="gl" style="font-size:9px;letter-spacing:3px">' +
                     (d.purge || "") + "</div>";
      setTimeout(() => { gf.style.display = "none"; }, 2600);
    }
    log("MODE ▸ " + (d.modes || []).join("+") || "none", "ok");
  } catch (e) { log("MODE SWITCH FAILED", "warn"); }
  refreshStatus();
}

function sendModePhrase(phrase) {        /* free-form: 'wake up x sleep y' */
  return fetch("/api/mode", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ say: phrase }) });
}

document.querySelectorAll(".mchip").forEach(chip => {
  chip.addEventListener("click", () => setMode(chip.dataset.mode));
});

/* ---------- mic (Phoenix's own listener via the server) ---------- */
let micActive = false, voiceWake = false;

async function micCycle() {
  if (micActive || busy) return;
  micActive = true;
  $("mic-btn").classList.add("listening");
  $("reactor-state").textContent = "listening";
  addMsg("(listening on your mic - speak now, up to ~8 s)", "sys");
  log("MIC ▸ listening...");
  try {
    const r = await fetch("/api/listen", { method: "POST" });
    const data = await r.json();
    if (data.ok && data.text) {
      addMsg("(heard: " + data.text + ")", "sys");
      log("MIC ▸ heard", "ok");
      micActive = false;
      $("mic-btn").classList.remove("listening");
      send(data.text);            /* straight into the chat */
      return;
    }
    addMsg("(mic: " + (data.error || "nothing heard") + ")", "sys");
    log("MIC ▸ " + (data.error || "silence"), "warn");
  } catch (e) {
    addMsg("! Mic link failed: " + e, "err");
    log("LINK DOWN (mic)", "warn");
  }
  micActive = false;
  $("mic-btn").classList.remove("listening");
  if (!busy) $("reactor-state").textContent = "standby";
  promptEl.focus();
  if (voiceWake) setTimeout(micCycle, 800);   /* full voice: always-on mic */
}

$("mic-btn").onclick = micCycle;

/* voice mode: mic cycle restarts itself; typing quietly exits */
promptEl.addEventListener("keydown", e => {
  if (currentModes.includes("voice")) voiceWake = false;
});

/* ---------- boot sequence ---------- */
const bootSteps = [
  "INITIALIZING PHOENIX OS",
  "LOADING NEURAL CORE…",
  "CALIBRATING HUD ARRAY…",
  "SYNCING TELEMETRY…",
  "ALL SYSTEMS NOMINAL"
];
let bi = 0;
const bootTimer = setInterval(() => {
  bi++;
  if (bi < bootSteps.length) $("bootline").textContent = bootSteps[bi];
  if (bi >= bootSteps.length) {
    clearInterval(bootTimer);
    $("boot").classList.add("done");
    setTimeout(() => $("boot").remove(), 700);
    log("HUD online", "ok");
    promptEl.focus();
    refreshStatus();     /* syncs mode (and theme) from the core */
  }
}, 420);
</script>
